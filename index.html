<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Space Invaders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="224" height="256"></canvas>
  </div>
  <div id="controls">
    <button id="btnLeft" class="btn" aria-label="Move left">&#9664;</button>
    <button id="btnFire" class="btn fire" aria-label="Fire">FIRE</button>
    <button id="btnRight" class="btn" aria-label="Move right">&#9654;</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
